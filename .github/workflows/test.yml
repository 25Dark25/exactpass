name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: No third-party dependencies
        run: node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies || p.optionalDependencies) { console.error('Dependencies found'); process.exit(1); }"
      - run: npm test
