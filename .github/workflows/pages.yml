name: pages
# Publishes the web page of a released version (a tag) to GitHub Pages. Run it by hand after publishing a release:
# Actions -> pages -> Run workflow -> tag (for example v0.1.6). Requires Settings -> Pages -> Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.6)"
        required: true
        type: string
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The tag must look like v1.2.3 (got '$TAG')."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag matches package.json and the word list is the published one
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG" || { echo "::error::package.json version does not match $TAG."; exit 1; }
          echo "addd35536511597a02fa0a9ff1e5284677b8883b83e986e43f15a3db996b903e  wordlists/eff_large_wordlist.txt" | sha256sum -c -
      - run: npm test
        env:
          FORCE_COLOR: "1"
      - name: Assemble the site (the files serve.js serves, plus licenses and a manifest)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          files="index.html web/app.js web/style.css src/rng.js src/entropy.js src/generate.js src/i18n.js wordlists/eff_large_wordlist.txt wordlists/README.md LICENSE"
          mkdir _site
          for f in $files; do install -D -m 644 "$f" "_site/$f"; done
          {
            echo "exactpass $TAG"
            echo "commit $(git rev-parse HEAD)"
            echo "SHA-256 of every published file; compare with the same files in the tagged source:"
            (cd _site && sha256sum $files)
          } > _site/release.txt
          cat _site/release.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
