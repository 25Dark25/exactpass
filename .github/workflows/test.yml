name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: No third-party dependencies
        run: node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies || p.optionalDependencies) { console.error('Dependencies found'); process.exit(1); }"
      - run: npm test

  # Single stable check for the branch ruleset: it fails if any matrix job failed or was cancelled.
  all-tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          test "$RESULT" = "success"
